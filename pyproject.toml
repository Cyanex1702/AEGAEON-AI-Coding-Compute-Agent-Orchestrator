[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegaeon-lite"
version = "2.0.0"
description = "A small notebook-first coding assistant with bounded tools and verified transfers"
requires-python = ">=3.11"
dependencies = []
license = {file = "LICENSE"}

[project.scripts]
aegaeon-lite = "aegaeon_lite.cli:main"

[tool.setuptools.packages.find]
include = ["aegaeon_lite*"]

[tool.setuptools.package-data]
aegaeon_lite = ["web/*.html", "web/*.css", "web/*.js", "model_catalog.json", "web/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
